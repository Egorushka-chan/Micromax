<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="1220" viewBox="0 0 2520 1220" role="img" aria-labelledby="title desc">
  <title id="title">IDEF1X-схема базы данных MicroMax</title>
  <desc id="desc">Схема базы данных MicroMax на русском языке с отображением складской структуры, операций, пользователей и штрихкодов.</desc>
  <defs>
    <style><![CDATA[
      .bg { fill: #f4f7fb; }
      .entity { fill: #ffffff; stroke: #304766; stroke-width: 2; rx: 10; ry: 10; }
      .header { fill: #304766; }
      .sep { stroke: #d5ddea; stroke-width: 1; }
      .shadow { fill: #dbe4f0; opacity: 0.45; }
      .title-main { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #1b2a41; }
      .title-sub { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #5f6f86; }
      .entity-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .entity-subtitle { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #dfe7f2; }
      .attr { font: 16px 'Segoe UI', Arial, sans-serif; fill: #24364d; }
      .pk { font-weight: 700; }
      .note-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #24364d; }
      .note-text { font: 15px 'Segoe UI', Arial, sans-serif; fill: #334b68; }
      .rel { fill: none; stroke: #49617f; stroke-width: 2.2; stroke-dasharray: 9 6; }
      .rel-logical { fill: none; stroke: #b14a45; stroke-width: 2.2; stroke-dasharray: 3 7; }
      .rel-label { font: 14px 'Segoe UI', Arial, sans-serif; fill: #2e4663; }
      .rel-label-logical { font: 14px 'Segoe UI', Arial, sans-serif; fill: #8f3732; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="2520" height="1220" />

  <text class="title-main" x="40" y="48">IDEF1X-схема базы данных MicroMax</text>
  <text class="title-sub" x="40" y="76">Схема построена по текущим серверным моделям и миграциям MVP</text>

  <!-- Role -->
  <g transform="translate(40,100)">
    <rect class="shadow" x="8" y="8" width="360" height="180" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="360" height="180" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="360" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Роль</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: Roles</text>
    <line class="sep" x1="0" y1="56" x2="360" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">AK1 Код роли / Code : varchar(32)</text>
    <text class="attr" x="16" y="136">Наименование / Name : varchar(120)</text>
  </g>

  <!-- AppUser -->
  <g transform="translate(440,80)">
    <rect class="shadow" x="8" y="8" width="420" height="260" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="420" height="260" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="420" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Пользователь</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: AppUsers</text>
    <line class="sep" x1="0" y1="56" x2="420" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">AK1 Электронная почта / Email : varchar(256)</text>
    <text class="attr" x="16" y="136">ФИО или имя / DisplayName : varchar(120)</text>
    <text class="attr" x="16" y="162">Хэш пароля / PasswordHash : varchar(512)</text>
    <text class="attr" x="16" y="188">Дата создания / CreatedAt : timestamptz</text>
    <text class="attr" x="16" y="214">Признак активности / IsActive : bool</text>
  </g>

  <!-- Warehouse -->
  <g transform="translate(980,100)">
    <rect class="shadow" x="8" y="8" width="360" height="180" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="360" height="180" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="360" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Склад</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: Warehouses</text>
    <line class="sep" x1="0" y1="56" x2="360" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">Наименование / Name : varchar(120)</text>
    <text class="attr" x="16" y="136">Адрес / Address : varchar(240), NULL</text>
  </g>

  <!-- StorageZone -->
  <g transform="translate(1400,80)">
    <rect class="shadow" x="8" y="8" width="400" height="232" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="400" height="232" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="400" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Зона хранения</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: StorageZones</text>
    <line class="sep" x1="0" y1="56" x2="400" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">FK  Склад / WarehouseId : int</text>
    <text class="attr" x="16" y="136">Код зоны / Code : varchar(32)</text>
    <text class="attr" x="16" y="162">Наименование / Name : varchar(120)</text>
    <text class="attr" x="16" y="188">AK1 WarehouseId + Code</text>
  </g>

  <!-- StorageCell -->
  <g transform="translate(1860,80)">
    <rect class="shadow" x="8" y="8" width="400" height="232" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="400" height="232" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="400" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Ячейка хранения</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: StorageCells</text>
    <line class="sep" x1="0" y1="56" x2="400" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">FK  Зона / StorageZoneId : int</text>
    <text class="attr" x="16" y="136">Код ячейки / Code : varchar(32)</text>
    <text class="attr" x="16" y="162">Наименование / Name : varchar(120)</text>
    <text class="attr" x="16" y="188">AK1 StorageZoneId + Code</text>
  </g>

  <!-- WarehouseUser -->
  <g transform="translate(40,420)">
    <rect class="shadow" x="8" y="8" width="470" height="232" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="470" height="232" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="470" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Привязка пользователя к складу</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: WarehouseUsers</text>
    <line class="sep" x1="0" y1="56" x2="470" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">FK  Склад / WarehouseId : int</text>
    <text class="attr" x="16" y="136">FK  Пользователь / UserId : int</text>
    <text class="attr" x="16" y="162">FK  Роль / RoleId : int</text>
    <text class="attr" x="16" y="188">Дата создания / CreatedAt : timestamptz</text>
    <text class="attr" x="16" y="214">AK1 WarehouseId + UserId</text>
  </g>

  <!-- RefreshToken -->
  <g transform="translate(540,420)">
    <rect class="shadow" x="8" y="8" width="420" height="232" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="420" height="232" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="420" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Refresh-токен</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: RefreshTokens</text>
    <line class="sep" x1="0" y1="56" x2="420" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">FK  Пользователь / UserId : int</text>
    <text class="attr" x="16" y="136">AK1 Хэш токена / TokenHash : varchar(128)</text>
    <text class="attr" x="16" y="162">Срок действия / ExpiresAt : timestamptz</text>
    <text class="attr" x="16" y="188">Дата отзыва / RevokedAt : timestamptz, NULL</text>
    <text class="attr" x="16" y="214">Дата создания / CreatedAt : timestamptz</text>
  </g>

  <!-- WarehouseOperation -->
  <g transform="translate(980,400)">
    <rect class="shadow" x="8" y="8" width="520" height="336" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="520" height="336" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="520" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Складская операция</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: WarehouseOperations</text>
    <line class="sep" x1="0" y1="56" x2="520" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">Тип операции / Type : int (enum)</text>
    <text class="attr" x="16" y="136">FK  Склад / WarehouseId : int</text>
    <text class="attr" x="16" y="162">FK  Номенклатура / ProductId : int</text>
    <text class="attr" x="16" y="188">FK  Исходная ячейка / SourceCellId : int, NULL</text>
    <text class="attr" x="16" y="214">FK  Целевая ячейка / TargetCellId : int, NULL</text>
    <text class="attr" x="16" y="240">FK  Пользователь / AppUserId : int, NULL</text>
    <text class="attr" x="16" y="266">Количество / Quantity : decimal(18,3)</text>
    <text class="attr" x="16" y="292">Комментарий / Comment : varchar(500), NULL</text>
    <text class="attr" x="16" y="318">Дата создания / CreatedAt : timestamptz</text>
  </g>

  <!-- StockBalance -->
  <g transform="translate(1560,470)">
    <rect class="shadow" x="8" y="8" width="380" height="206" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="380" height="206" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="380" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Остаток</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: StockBalances</text>
    <line class="sep" x1="0" y1="56" x2="380" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">FK  Номенклатура / ProductId : int</text>
    <text class="attr" x="16" y="136">FK  Ячейка / StorageCellId : int</text>
    <text class="attr" x="16" y="162">Количество / Quantity : decimal(18,3)</text>
    <text class="attr" x="16" y="188">AK1 ProductId + StorageCellId</text>
  </g>

  <!-- Product -->
  <g transform="translate(1980,400)">
    <rect class="shadow" x="8" y="8" width="460" height="258" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="460" height="258" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="460" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Номенклатура</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: Products</text>
    <line class="sep" x1="0" y1="56" x2="460" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">AK1 Артикул / Sku : varchar(64)</text>
    <text class="attr" x="16" y="136">Наименование / Name : varchar(160)</text>
    <text class="attr" x="16" y="162">Единица измерения / Unit : varchar(24)</text>
    <text class="attr" x="16" y="188">Минимальный остаток / MinQuantity : decimal(18,3)</text>
  </g>

  <!-- OperationLog -->
  <g transform="translate(980,840)">
    <rect class="shadow" x="8" y="8" width="420" height="180" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="420" height="180" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="420" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Журнал операций</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: OperationLogs</text>
    <line class="sep" x1="0" y1="56" x2="420" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">FK  Операция / WarehouseOperationId : int</text>
    <text class="attr" x="16" y="136">Сообщение / Message : varchar(600)</text>
    <text class="attr" x="16" y="162">Дата создания / CreatedAt : timestamptz</text>
  </g>

  <!-- Barcode -->
  <g transform="translate(1850,820)">
    <rect class="shadow" x="8" y="8" width="500" height="310" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="500" height="310" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="500" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Штрихкод</text>
    <text class="entity-subtitle" x="18" y="48">Таблица: Barcodes</text>
    <line class="sep" x1="0" y1="56" x2="500" y2="56" />
    <text class="attr pk" x="16" y="84">PK  Идентификатор / Id : int</text>
    <text class="attr" x="16" y="110">Значение / Value : varchar(160)</text>
    <text class="attr" x="16" y="136">Тип кодировки / Symbology : text</text>
    <text class="attr" x="16" y="162">Тип сущности / EntityType : text</text>
    <text class="attr" x="16" y="188">Идентификатор сущности / EntityId : int</text>
    <text class="attr" x="16" y="214">Основной код / IsPrimary : bool</text>
    <text class="attr" x="16" y="240">Активный код / IsActive : bool</text>
    <text class="attr" x="16" y="266">Дата создания / CreatedAt : timestamptz</text>
    <text class="attr" x="16" y="292">FK  Создал / CreatedByUserId : int</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,760)">
    <rect class="shadow" x="8" y="8" width="780" height="270" rx="10" ry="10" />
    <rect class="entity" x="0" y="0" width="780" height="270" rx="10" ry="10" />
    <rect class="header" x="0" y="0" width="780" height="56" rx="10" ry="10" />
    <text class="entity-title" x="18" y="30">Примечания к нотации</text>
    <text class="entity-subtitle" x="18" y="48">Условности для чтения схемы</text>
    <line class="sep" x1="0" y1="56" x2="780" y2="56" />
    <text class="note-text" x="16" y="92">PK — первичный ключ таблицы.</text>
    <text class="note-text" x="16" y="120">AK — альтернативный ключ или уникальное бизнес-ограничение.</text>
    <text class="note-text" x="16" y="148">Пунктирная синяя линия — неидентифицирующая внешняя связь в логике IDEF1X.</text>
    <text class="note-text" x="16" y="176">Красная точечная линия — логическая полиморфная связь без отдельного SQL-внешнего ключа.</text>
    <text class="note-text" x="16" y="204">В диаграмму не включена служебная таблица __EFMigrationsHistory.</text>
    <text class="note-text" x="16" y="232">Для Barcodes частичные уникальные индексы действуют только для активных записей.</text>
  </g>

  <!-- Relationships -->
  <path class="rel" d="M220 280 V350 H180 V420" />
  <text class="rel-label" x="118" y="348">Роль 1 : N привязок</text>

  <path class="rel" d="M440 210 H320 V510 H510" />
  <text class="rel-label" x="326" y="360">Пользователь 1 : N привязок</text>

  <path class="rel" d="M980 190 H760 V610 H510" />
  <text class="rel-label" x="772" y="602">Склад 1 : N привязок</text>

  <path class="rel" d="M650 340 V420" />
  <text class="rel-label" x="668" y="392">Пользователь 1 : N refresh-токенов</text>

  <path class="rel" d="M1340 190 H1400" />
  <text class="rel-label" x="1438" y="180">Склад 1 : N зон</text>

  <path class="rel" d="M1800 196 H1860" />
  <text class="rel-label" x="1812" y="184">Зона 1 : N ячеек</text>

  <path class="rel" d="M1160 280 V400" />
  <text class="rel-label" x="1178" y="350">Склад 1 : N операций</text>

  <path class="rel" d="M860 210 H920 V560 H980" />
  <text class="rel-label" x="900" y="388">Пользователь 0..1 : N операций</text>

  <path class="rel" d="M1500 460 H1700 V360 H2140 V400" />
  <text class="rel-label" x="1730" y="350">Номенклатура 1 : N операций</text>

  <path class="rel" d="M1860 250 H1740 V480 H1500" />
  <text class="rel-label" x="1602" y="468">Исходная ячейка 0..1 : N операций</text>

  <path class="rel" d="M1860 282 H1710 V560 H1500" />
  <text class="rel-label" x="1580" y="548">Целевая ячейка 0..1 : N операций</text>

  <path class="rel" d="M2060 312 V390 H1750 V470" />
  <text class="rel-label" x="1812" y="382">Ячейка 1 : N остатков</text>

  <path class="rel" d="M1940 570 H1980" />
  <text class="rel-label" x="1832" y="558">Номенклатура 1 : N остатков</text>

  <path class="rel" d="M1240 736 V840" />
  <text class="rel-label" x="1260" y="792">Операция 1 : N записей журнала</text>

  <path class="rel" d="M860 300 H1520 V780 H1850 V980" />
  <text class="rel-label" x="1180" y="770">Пользователь 1 : N созданных штрихкодов</text>

  <path class="rel-logical" d="M2250 820 V700 H2210 V658" />
  <text class="rel-label-logical" x="2118" y="720">Логическая связь с номенклатурой</text>
  <text class="rel-label-logical" x="2146" y="740">EntityType = Product</text>

  <path class="rel-logical" d="M2000 820 V700 H2060 V312" />
  <text class="rel-label-logical" x="1880" y="640">Логическая связь с ячейкой</text>
  <text class="rel-label-logical" x="1930" y="660">EntityType = Cell</text>
</svg>
