<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3180" viewBox="0 0 1600 3180">
  <defs>
    <style>
      .title { font: 700 34px "Segoe UI", Calibri, Arial, sans-serif; fill: #1f1f1f; }
      .lane-title { font: 700 28px "Segoe UI", Calibri, Arial, sans-serif; fill: #1f1f1f; }
      .text { font: 24px "Segoe UI", Calibri, Arial, sans-serif; fill: #1f1f1f; text-anchor: middle; }
      .small { font: 22px "Segoe UI", Calibri, Arial, sans-serif; fill: #1f1f1f; }
      .shape { fill: #ffffff; stroke: #1f1f1f; stroke-width: 2.2; }
      .lane { fill: none; stroke: #b8b8b8; stroke-width: 1.6; stroke-dasharray: 10 8; }
      .arrow { fill: none; stroke: #1f1f1f; stroke-width: 2.4; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="3180" fill="#ffffff"/>
  <text x="800" y="52" class="title" text-anchor="middle">Схема алгоритма выполнения складской операции</text>

  <rect x="60" y="90" width="670" height="3000" class="lane"/>
  <rect x="870" y="90" width="670" height="3000" class="lane"/>
  <line x1="800" y1="90" x2="800" y2="3090" class="lane"/>

  <rect x="170" y="110" width="450" height="60" rx="20" ry="20" class="shape"/>
  <text x="395" y="148" class="lane-title" text-anchor="middle">Мобильное приложение</text>

  <rect x="980" y="110" width="450" height="60" rx="20" ry="20" class="shape"/>
  <text x="1205" y="148" class="lane-title" text-anchor="middle">Серверная часть</text>

  <rect x="245" y="205" width="300" height="72" rx="32" ry="32" class="shape"/>
  <text x="395" y="249" class="text">
    <tspan x="395">Начало</tspan>
  </text>

  <polygon points="235,330 580,330 555,430 210,430" class="shape"/>
  <text x="395" y="379" class="text">
    <tspan x="395">Выбор типа операции</tspan>
    <tspan x="395" dy="28">и открытие формы</tspan>
  </text>

  <polygon points="205,470 615,470 585,610 175,610" class="shape"/>
  <text x="395" y="524" class="text">
    <tspan x="395">Ввод данных:</tspan>
    <tspan x="395" dy="28">номенклатура, ячейки,</tspan>
    <tspan x="395" dy="28">количество, примечание</tspan>
  </text>

  <polygon points="395,650 545,715 395,780 245,715" class="shape"/>
  <text x="395" y="694" class="text">
    <tspan x="395">Локальная проверка</tspan>
    <tspan x="395" dy="28">пройдена?</tspan>
  </text>

  <rect x="60" y="840" width="230" height="110" class="shape"/>
  <text x="175" y="883" class="text">
    <tspan x="175">Показ ошибки</tspan>
    <tspan x="175" dy="28">и возврат</tspan>
    <tspan x="175" dy="28">к форме</tspan>
  </text>

  <rect x="310" y="840" width="310" height="110" class="shape"/>
  <text x="465" y="883" class="text">
    <tspan x="465">Карточка</tspan>
    <tspan x="465" dy="28">подтверждения</tspan>
    <tspan x="465" dy="28">операции</tspan>
  </text>

  <polygon points="395,1000 545,1065 395,1130 245,1065" class="shape"/>
  <text x="395" y="1044" class="text">
    <tspan x="395">Пользователь</tspan>
    <tspan x="395" dy="28">подтвердил?</tspan>
  </text>

  <rect x="60" y="1020" width="230" height="90" class="shape"/>
  <text x="175" y="1060" class="text">
    <tspan x="175">Отмена.</tspan>
    <tspan x="175" dy="28">Данные не меняются</tspan>
  </text>

  <polygon points="210,1200 620,1200 590,1310 180,1310" class="shape"/>
  <text x="400" y="1245" class="text">
    <tspan x="400">POST /api/warehouses/{id}</tspan>
    <tspan x="400" dy="28">/operations/receive|move|</tspan>
    <tspan x="400" dy="28">write-off|adjust</tspan>
  </text>

  <rect x="970" y="1205" width="470" height="92" class="shape"/>
  <text x="1205" y="1248" class="text">
    <tspan x="1205">Контроллер API:</tspan>
    <tspan x="1205" dy="28">авторизация и получение userId</tspan>
  </text>

  <rect x="945" y="1345" width="520" height="112" class="shape"/>
  <text x="1205" y="1385" class="text">
    <tspan x="1205">Проверка прав на выполнение</tspan>
    <tspan x="1205" dy="28">операции и принадлежности</tspan>
    <tspan x="1205" dy="28">ячеек выбранному складу</tspan>
  </text>

  <rect x="930" y="1505" width="550" height="126" class="shape"/>
  <text x="1205" y="1545" class="text">
    <tspan x="1205">Проверка предметной области:</tspan>
    <tspan x="1205" dy="28">товар и ячейки существуют,</tspan>
    <tspan x="1205" dy="28">количество корректно, склад</tspan>
    <tspan x="1205" dy="28">для операции определён</tspan>
  </text>

  <polygon points="1205,1670 1355,1735 1205,1800 1055,1735" class="shape"/>
  <text x="1205" y="1715" class="text">
    <tspan x="1205">Все проверки</tspan>
    <tspan x="1205" dy="28">пройдены?</tspan>
  </text>

  <rect x="1280" y="1830" width="230" height="104" class="shape"/>
  <text x="1395" y="1872" class="text">
    <tspan x="1395">Возврат ошибки</tspan>
    <tspan x="1395" dy="28">403 / 404 / 409</tspan>
    <tspan x="1395" dy="28">без изменения данных</tspan>
  </text>

  <rect x="1070" y="1835" width="270" height="82" class="shape"/>
  <text x="1205" y="1885" class="text">
    <tspan x="1205">Начало транзакции БД</tspan>
  </text>

  <polygon points="1205,1960 1355,2025 1205,2090 1055,2025" class="shape"/>
  <text x="1205" y="2004" class="text">
    <tspan x="1205">Тип</tspan>
    <tspan x="1205" dy="28">операции?</tspan>
  </text>

  <rect x="890" y="2140" width="280" height="122" class="shape"/>
  <text x="1030" y="2180" class="text">
    <tspan x="1030">Приёмка:</tspan>
    <tspan x="1030" dy="28">создать или найти</tspan>
    <tspan x="1030" dy="28">остаток и увеличить</tspan>
    <tspan x="1030" dy="28">его в целевой ячейке</tspan>
  </text>

  <rect x="1240" y="2140" width="280" height="132" class="shape"/>
  <text x="1380" y="2180" class="text">
    <tspan x="1380">Списание:</tspan>
    <tspan x="1380" dy="28">найти исходный остаток,</tspan>
    <tspan x="1380" dy="28">проверить достаточность</tspan>
    <tspan x="1380" dy="28">и уменьшить его</tspan>
  </text>

  <rect x="890" y="2310" width="280" height="142" class="shape"/>
  <text x="1030" y="2350" class="text">
    <tspan x="1030">Перемещение:</tspan>
    <tspan x="1030" dy="28">проверить остаток</tspan>
    <tspan x="1030" dy="28">в ячейке-источнике,</tspan>
    <tspan x="1030" dy="28">уменьшить источник</tspan>
    <tspan x="1030" dy="28">и увеличить назначение</tspan>
  </text>

  <rect x="1240" y="2310" width="280" height="142" class="shape"/>
  <text x="1380" y="2350" class="text">
    <tspan x="1380">Корректировка:</tspan>
    <tspan x="1380" dy="28">создать или найти остаток,</tspan>
    <tspan x="1380" dy="28">вычислить разницу</tspan>
    <tspan x="1380" dy="28">и установить</tspan>
    <tspan x="1380" dy="28">целевое значение</tspan>
  </text>

  <rect x="1015" y="2490" width="380" height="112" class="shape"/>
  <text x="1205" y="2532" class="text">
    <tspan x="1205">Создание WarehouseOperation</tspan>
    <tspan x="1205" dy="28">и записи в OperationLog</tspan>
    <tspan x="1205" dy="28">для журнала операций</tspan>
  </text>

  <rect x="1050" y="2645" width="310" height="92" class="shape"/>
  <text x="1205" y="2699" class="text">
    <tspan x="1205">SaveChanges и Commit</tspan>
  </text>

  <polygon points="1035,2780 1375,2780 1345,2880 1005,2880" class="shape"/>
  <text x="1190" y="2826" class="text">
    <tspan x="1190">Возврат 200 OK</tspan>
    <tspan x="1190" dy="28">с результатом операции</tspan>
    <tspan x="1190" dy="28">и временем выполнения</tspan>
  </text>

  <rect x="180" y="2785" width="430" height="102" class="shape"/>
  <text x="395" y="2831" class="text">
    <tspan x="395">Повторная загрузка снимка</tspan>
    <tspan x="395" dy="28">склада: остатки, ячейки,</tspan>
    <tspan x="395" dy="28">журнал операций</tspan>
  </text>

  <rect x="590" y="2950" width="420" height="104" class="shape"/>
  <text x="800" y="2995" class="text">
    <tspan x="800">Показ пользователю</tspan>
    <tspan x="800" dy="28">статуса операции</tspan>
    <tspan x="800" dy="28">и актуальных данных</tspan>
  </text>

  <rect x="650" y="3090" width="300" height="72" rx="32" ry="32" class="shape"/>
  <text x="800" y="3134" class="text">
    <tspan x="800">Конец</tspan>
  </text>

  <path d="M395 277 L395 320" class="arrow" marker-end="url(#arrow)"/>
  <path d="M395 430 L395 462" class="arrow" marker-end="url(#arrow)"/>
  <path d="M395 610 L395 646" class="arrow" marker-end="url(#arrow)"/>

  <path d="M545 715 L620 715 L620 895" class="arrow" marker-end="url(#arrow)"/>
  <text x="572" y="700" class="small">Да</text>

  <path d="M245 715 L175 715 L175 835" class="arrow" marker-end="url(#arrow)"/>
  <text x="190" y="700" class="small">Нет</text>

  <path d="M175 840 L175 690 L170 690 L170 540 L198 540" class="arrow" marker-end="url(#arrow)"/>

  <path d="M465 950 L465 995" class="arrow" marker-end="url(#arrow)"/>

  <path d="M245 1065 L175 1065" class="arrow" marker-end="url(#arrow)"/>
  <text x="205" y="1045" class="small">Нет</text>

  <path d="M395 1130 L395 1192" class="arrow" marker-end="url(#arrow)"/>
  <text x="415" y="1158" class="small">Да</text>

  <path d="M290 1065 L100 1065 L100 3000 L590 3000" class="arrow" marker-end="url(#arrow)"/>

  <path d="M620 1255 L960 1255" class="arrow" marker-end="url(#arrow)"/>

  <path d="M1205 1297 L1205 1337" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1205 1457 L1205 1497" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1205 1631 L1205 1666" class="arrow" marker-end="url(#arrow)"/>

  <path d="M1355 1735 L1395 1735 L1395 1822" class="arrow" marker-end="url(#arrow)"/>
  <text x="1365" y="1715" class="small">Нет</text>

  <path d="M1205 1800 L1205 1827" class="arrow" marker-end="url(#arrow)"/>
  <text x="1223" y="1790" class="small">Да</text>

  <path d="M1205 1917 L1205 1952" class="arrow" marker-end="url(#arrow)"/>

  <path d="M1125 2025 L1030 2025 L1030 2132" class="arrow" marker-end="url(#arrow)"/>
  <text x="1050" y="2003" class="small">Приёмка</text>

  <path d="M1285 2025 L1380 2025 L1380 2132" class="arrow" marker-end="url(#arrow)"/>
  <text x="1370" y="2003" class="small">Списание</text>

  <path d="M1170 2078 L1030 2078 L1030 2302" class="arrow" marker-end="url(#arrow)"/>
  <text x="1030" y="2288" class="small">Перемещение</text>

  <path d="M1240 2078 L1380 2078 L1380 2302" class="arrow" marker-end="url(#arrow)"/>
  <text x="1380" y="2288" class="small">Корректировка</text>

  <path d="M1030 2262 L1030 2482 L1205 2482" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1380 2272 L1380 2482 L1215 2482" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1030 2452 L1030 2482 L1195 2482" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1380 2452 L1380 2482 L1215 2482" class="arrow" marker-end="url(#arrow)"/>

  <path d="M1205 2602 L1205 2637" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1205 2737 L1205 2772" class="arrow" marker-end="url(#arrow)"/>

  <path d="M1005 2830 L620 2830" class="arrow" marker-end="url(#arrow)"/>
  <path d="M395 2887 L395 2942 L590 2942" class="arrow" marker-end="url(#arrow)"/>

  <path d="M1395 1934 L1395 3000 L1010 3000" class="arrow" marker-end="url(#arrow)"/>
  <path d="M800 3054 L800 3086" class="arrow" marker-end="url(#arrow)"/>
</svg>
